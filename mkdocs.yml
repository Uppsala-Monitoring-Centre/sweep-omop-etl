site_name: SWEEP OMOP ETL
site_description: ETL pipeline mapping Swedish register data to the OMOP Common Data Model
site_url: https://uppsala-monitoring-centre.github.io/sweep-omop-etl/
repo_url: https://github.com/Uppsala-Monitoring-Centre/sweep-omop-etl
repo_name: sweep-omop-etl
edit_uri: blob/main/docs/

docs_dir: docs

# Pages kept out of the website. Remove an entry (and add it to `nav`) to publish it.
exclude_docs: |
  drug_mapping_quality.md

nav:
  - Home: index.md
  - Mapping overview: Documentation_Mapping.md
  - Purpose: purpose.md
  - Transformation rules: transformation.md
  - Vocabulary mappings: vocabulary.md
  - Data quality: data_quality.md
  - Mapping register: mapping_register.md # generated from SWEEP_ETL_specification.xlsx
  - Releases: RELEASES.md

hooks:
  - scripts/docs/mkdocs_hooks.py

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
